apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: akehir-site
  namespace: akehir
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: akehir.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: akehir-site
                port:
                  number: 8001
          - path: /api/widgets
            pathType: Prefix
            backend:
              service:
                name: akehir-site-dash
                port:
                  number: 3000
  tls:
    - hosts:
      - akehir.com
      secretName: akehir-com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: akehir-site-www
  namespace: akehir
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: www.akehir.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: akehir-site
                port:
                  number: 8001
  tls:
    - hosts:
        - www.akehir.com
      secretName: www-akehir-com
