---
apiVersion: v1
kind: Service
metadata:
  name: akehir-site
  namespace: akehir
spec:
  selector:
    app: akehir-site
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8811
---
kind: Service
apiVersion: v1
metadata:
  name: akehir-site-dash
  namespace: akehir
spec:
  type: ExternalName
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  externalName: homepage.homepage.svc.cluster.local
---

