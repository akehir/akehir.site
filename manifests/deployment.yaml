apiVersion: apps/v1
kind: Deployment
metadata:
  name: akehir-site
  namespace: akehir
spec:
  selector:
    matchLabels:
      app: akehir-site
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: akehir-site
    spec:
      containers:
        - name: akehir-site
          image: registry.akehir.com:443/akehir/akehir.site/akehir-site:master-9f2940a6-1752771725 # {"$imagepolicy": "akehir:akehir-www-image-policy"}
          ports:
            - containerPort: 8811
      imagePullSecrets:
        - name: registry-akehir
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: module
                    operator: In
                    values:
                      - akehir-site
              topologyKey: "kubernetes.io/hostname"
