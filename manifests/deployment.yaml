apiVersion: apps/v1
kind: Deployment
metadata:
  name: akehir-site
  namespace: akehir
spec:
  selector:
    matchLabels:
      app: akehir-site
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: akehir-site
    spec:
      securityContext:
        fsGroup: 1337
        runAsNonRoot: true
        runAsUser: 1337
      containers:
        - name: akehir-site
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            privileged: false
            seccompProfile:
              type: RuntimeDefault
          image: registry.akehir.com:443/akehir/akehir.site/akehir-site:master-eda044eb-1793993646 # {"$imagepolicy": "akehir:akehir-www-image-policy"}
          ports:
            - containerPort: 8811
          volumeMounts:
            - mountPath: "/app/assets/images"
              name: akehir-images-volume
              readOnly: true
              recursiveReadOnly: IfPossible
            - mountPath: /var/cache/nginx
              name: cache
            - mountPath: /run
              name: run
      volumes:
        - name: akehir-images-volume
          nfs:
            server: zhrs1.akehir.com
            path: /volume1/ake/web/akehir/images
        - name: cache
          emptyDir:
            sizeLimit: 500Mi
        - name: run
          emptyDir:
            sizeLimit: 1Mi
      imagePullSecrets:
        - name: registry-akehir
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: module
                    operator: In
                    values:
                      - akehir-site
              topologyKey: "kubernetes.io/hostname"
