apiVersion: apps/v1
kind: Deployment
metadata:
  name: akehir-site
  namespace: akehir
spec:
  selector:
    matchLabels:
      app: akehir-site
  replicas: 1
  template:
    metadata:
      labels:
        app: akehir-site
    spec:
      containers:
      - name: akehir-site
        image: registry.akehir.com:443/akehir/akehir.site/akehir-site:master-80aa64fd-1717766427 # {"$imagepolicy": "akehir:akehir-www-image-policy"}
        ports:
        - containerPort: 8811
      imagePullSecrets:
      - name: registry-akehir
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
