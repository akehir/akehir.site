apiVersion: apps/v1
kind: Deployment
metadata:
  name: akehir-site
  namespace: akehir
spec:
  selector:
    matchLabels:
      app: akehir-site
  replicas: 1
  template:
    metadata:
      labels:
        app: akehir-site
    spec:
      containers:
        - name: akehir-site
          image: registry.akehir.com:443/akehir/akehir.site/akehir-site:master-e94db81f-1741367843 # {"$imagepolicy": "akehir:akehir-www-image-policy"}
          ports:
            - containerPort: 8811
      imagePullSecrets:
        - name: registry-akehir
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
