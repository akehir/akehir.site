events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;

    server {
        listen 8811;
        listen [::]:8811;

        resolver 127.0.0.1;
        autoindex off;

        server_name _;
        server_tokens off;

        root /app;
        gzip_static on;

        add_header content-security-policy "default-src 'none'; img-src 'self'; script-src 'self'; style-src 'self'; trusted-types angular angular#bundler; require-trusted-types-for 'script';" always;
        add_header feature-policy "microphone 'none'; geolocation 'none'; usb 'none'; payment 'none'; camera 'none'; display-capture 'none';" always;
        add_header permissions-policy "microphone=(), geolocation=(), usb=(), payment=(), camera=(), display-capture=()" always;
        add_header cross-origin-embedder-policy "require-corp" always;
        add_header cross-origin-resource-policy: "same-origin always;
        add_header cross-origin-opener-policy: "same-origin always;

        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # Media: images, icons, video, audio, HTC
        location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|mp3|ogg|ogv|webm|htc|woff2|woff)$ {
            expires 1y;
        }

        # CSS and Javascript
        location ~* \.(?:css|js)$ {
            expires 1y;
        }
    }
}
