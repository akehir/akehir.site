events {
    worker_connections 1024;
}

http {
    include mime.types;
    types {
      application/manifest+json  webmanifest;
    }

    sendfile on;

    server {
        listen 8811;
        listen [::]:8811;

        resolver 127.0.0.1;
        autoindex off;

        server_name _;
        server_tokens off;

        port_in_redirect off;
        server_name_in_redirect off;
        absolute_redirect off;

        root /app;
        gzip_static on;
        # gzip on;
        # gzip_types
        #    text/plain
        #    text/css
        #    application/json
        #    application/javascript
        #    application/x-javascript
        #    text/xml
        #    application/xml
        #    application/xml+rss
        #    text/javascript;

        add_header content-security-policy "default-src 'none'; img-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self';" always;
        add_header feature-policy "microphone 'none'; geolocation 'none'; usb 'none'; payment 'none'; camera 'none'; display-capture 'none';" always;
        add_header permissions-policy "microphone=(), geolocation=(), usb=(), payment=(), camera=(), display-capture=()" always;
        add_header cross-origin-embedder-policy "require-corp" always;
        add_header cross-origin-resource-policy "same-origin" always;
        add_header cross-origin-opener-policy "noopener-allow-popups" always;

        location / {
            try_files $uri $uri/ $uri/index.html /index.html =404;
        }

        # Media: images, icons, video, audio, HTC
        location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|mp3|ogg|ogv|webm|htc|woff2|woff)$ {
            expires 1y;
        }

        # CSS and Javascript
        location ~* \.(?:css|js)$ {
            expires 1y;
        }

        # Service worker script: always revalidate so new versions are discovered
        location = /ngsw-worker.js {
            expires -1;
        }
    }
}
