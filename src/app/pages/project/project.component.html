@if (project$ | async; as project) {
  <li class="hex">
    <div class="hex-in">
      <ake-hex class="hex-link" [project]="project"></ake-hex>
    </div>
  </li>
  <pre>{{ project | json }}</pre>
  @if (project?.path) {
    <div class="project__showcase">
      <img
        class="project__showcase-image"
        src="../../../assets/iphone.svg"
        alt="An iphone as a frame" />
      <iframe
        class="project__showcase-frame"
        [src]="getIframeSrc(project.path)"></iframe>
    </div>
  }
}
