<div>
  <div class="ake-blog-entries--links">
    <a href="/assets/rss.xml" class="ake-blog-entries--rss">RSS Feed</a>
    <a
      routerLink="/blog/search"
      queryParamsHandling="merge"
      class="ake-blog-entries--search-link"
    >
      Search
    </a>
  </div>
  <ake-blog-search mode="inline" class="ake-blog-entries--search"></ake-blog-search>
  @for (entry of entries; track entry.routerLink) {
    <a [routerLink]="entry.routerLink" class="ake-blog-entries--item">{{
      entry.title
    }}</a>
  }
</div>
