<form
  #consoleForm="ngForm"
  class="console console--intro"
  (ngSubmit)="onSubmit()">
  <div class="console--row">
    <div class="console--history">
      @for (command of console.pastCommands; track command) {
        <p>
          <span [style.color]="command.style.colour">{{ command.message }}</span>
        </p>
      }
    </div>
  </div>
  <div class="console--row console--bottom">
    <div class="console--icon">
      <font-awesome-icon name="terminal"></font-awesome-icon>
    </div>

    <div class="console--input-area" #inputArea>
      <div class="console--field">
        <label for="console--input" class="console--input-label"
          >Enter your command</label
          >
          <input
            type="text"
            id="console--input"
            name="console--input"
            autocomplete="off"
            cdkFocusRegionStart
            cdkFocusRegionEnd
            [(ngModel)]="command"
            class="console--input" />
        </div>
      </div>
    </div>
  </form>
