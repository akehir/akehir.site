@if (map$ | async; as map) {
  <ul class="grid">
    @for (coordinate of map.coordinates; track trackCoordinate($index, coordinate)) {
      <li
        class="hex"
        >
        <div class="hexIn">
          <ake-hex
            class="hexLink"
            (click)="log(coordinate)"
          [project]="coordinate?.project"></ake-hex>
        </div>
      </li>
    }
  </ul>
}
