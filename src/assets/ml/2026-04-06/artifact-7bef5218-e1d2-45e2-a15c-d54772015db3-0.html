                            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Control Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #7f8c8d;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
            border: 5px solid #34495e;
        }
        .ui {
            margin-bottom: 10px;
            text-align: center;
        }
        h1 { margin: 5px; }
        .instructions { font-size: 0.9rem; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Traffic Controller</h1>
        <div id="score">Score: 0</div>
        <div class="instructions">Click the lights to change them! Don't let them crash.</div>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // Game Constants
        const ROAD_WIDTH = 100;
        const CAR_SIZE = 30;
        const INTERSECTION_SIZE = ROAD_WIDTH;
        const CENTER = canvas.width / 2;

        // Game State
        let score = 0;
        let gameOver = false;
        let cars = [];
        let spawnTimer = 0;
        let spawnRate = 100; // Lower is faster

        // Traffic Light States (true = Green, false = Red)
        // verticalLight controls North/South traffic
        // horizontalLight controls East/West traffic
        let verticalLight = true;
        let horizontalLight = false;

        class Car {
            constructor(direction) {
                this.direction = direction; // 'N', 'S', 'E', 'W'
                this.width = CAR_SIZE;
                this.height = CAR_SIZE;
                this.speed = 2 + Math.random() * 2;
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
                this.stopped = false;

                // Set initial positions based on direction
                if (direction === 'E') { // Moving Right
                    this.x = -50;
                    this.y = CENTER - 25;
                    this.vx = this.speed;
                    this.vy = 0;
                    this.stopLine = CENTER - ROAD_WIDTH/2 - 40;
                } else if (direction === 'W') { // Moving Left
                    this.x = canvas.width + 50;
                    this.y = CENTER + 25;
                    this.vx = -this.speed;
                    this.vy = 0;
                    this.stopLine = CENTER + ROAD_WIDTH/2 + 10;
                } else if (direction === 'S') { // Moving Down
                    this.x = CENTER + 25;
                    this.y = -50;
                    this.vx = 0;
                    this.vy = this.speed;
                    this.stopLine = CENTER - ROAD_WIDTH/2 - 40;
                } else if (direction === 'N') { // Moving Up
                    this.x = CENTER - 25;
                    this.y = canvas.height + 50;
                    this.vx = 0;
                    this.vy = -this.speed;
                    this.stopLine = CENTER + ROAD_WIDTH/2 + 10;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Windows to show direction
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                if(this.direction === 'E') ctx.fillRect(this.x + 20, this.y + 5, 5, 20);
                if(this.direction === 'W') ctx.fillRect(this.x + 5, this.y + 5, 5, 20);
                if(this.direction === 'S') ctx.fillRect(this.x + 5, this.y + 20, 20, 5);
                if(this.direction === 'N') ctx.fillRect(this.x + 5, this.y + 5, 20, 5);
            }

            update() {
                let canMove = true;

                // Check Traffic Lights
                if (this.direction === 'E' || this.direction === 'W') {
                    // Horizontal cars respect horizontalLight
                    if (!horizontalLight) {
                        // If approaching the stop line
                        if (this.direction === 'E' && this.x < this.stopLine && this.x + this.speed >= this.stopLine) canMove = false;
                        if (this.direction === 'W' && this.x > this.stopLine && this.x - this.speed <= this.stopLine) canMove = false;
                    }
                } else {
                    // Vertical cars respect verticalLight
                    if (!verticalLight) {
                        if (this.direction === 'S' && this.y < this.stopLine && this.y + this.speed >= this.stopLine) canMove = false;
                        if (this.direction === 'N' && this.y > this.stopLine && this.y - this.speed <= this.stopLine) canMove = false;
                    }
                }

                if (canMove) {
                    this.x += this.vx;
                    this.y += this.vy;
                }
            }
        }

        function drawRoads() {
            ctx.fillStyle = '#34495e';
            // Vertical Road
            ctx.fillRect(CENTER - ROAD_WIDTH/2, 0, ROAD_WIDTH, canvas.height);
            // Horizontal Road
            ctx.fillRect(0, CENTER - ROAD_WIDTH/2, canvas.width, ROAD_WIDTH);

            // Road Lines
            ctx.strokeStyle = 'white';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 2;
            
            // Vertical dashed line
            ctx.beginPath();
            ctx.moveTo(CENTER, 0);
            ctx.lineTo(CENTER, canvas.height);
            ctx.stroke();

            // Horizontal dashed line
            ctx.beginPath();
            ctx.moveTo(0, CENTER);
            ctx.lineTo(canvas.width, CENTER);
            ctx.stroke();
            ctx.setLineDash([]); // Reset
        }

        function drawLights() {
            // Vertical Light (Controls N/S)
            ctx.fillStyle = verticalLight ? '#2ecc71' : '#e74c3c';
            ctx.beginPath();
            ctx.arc(CENTER + 70, CENTER - 70, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.stroke();

            // Horizontal Light (Controls E/W)
            ctx.fillStyle = horizontalLight ? '#2ecc71' : '#e74c3c';
            ctx.beginPath();
            ctx.arc(CENTER - 70, CENTER + 70, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.stroke();
        }

        function spawnCar() {
            const dirs = ['N', 'S', 'E', 'W'];
            const dir = dirs[Math.floor(Math.random() * dirs.length)];
            cars.push(new Car(dir));
        }

        function checkCollisions() {
            for (let i = 0; i < cars.length; i++) {
                for (let j = i + 1; j < cars.length; j++) {
                    const c1 = cars[i];
                    const c2 = cars[j];

                    if (c1.x < c2.x + c1.width &&
                        c1.x + c1.width > c2.x &&
                        c1.y < c2.y + c1.height &&
                        c1.y + c1.height > c2.y) {
                        gameOver = true;
                    }
                }
            }
        }

        function update() {
            if (gameOver) return;

            spawnTimer++;
            if (spawnTimer > spawnRate) {
                spawnCar();
                spawnTimer = 0;
                // Gradually make game harder
                if (spawnRate > 30) spawnRate -= 0.5;
            }

            cars.forEach((car, index) => {
                car.update();
                // Remove cars off screen and add score
                if (car.x < -100 || car.x > canvas.width + 100 || car.y < -100 || car.y > canvas.height + 100) {
                    cars.splice(index, 1);
                    score++;
                    scoreElement.innerText = `Score: ${score}`;
                }
            });

            checkCollisions();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRoads();
            drawLights();
            cars.forEach(car => car.draw());

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("GAME OVER!", CENTER, CENTER);
                ctx.font = '20px Arial';
                ctx.fillText("Click to Restart", CENTER, CENTER + 40);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Input Handling
        canvas.addEventListener('click', (e) => {
            if (gameOver) {
                // Reset Game
                score = 0;
                scoreElement.innerText = `Score: ${score}`;
                cars = [];
                spawnRate = 100;
                gameOver = false;
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if clicked near Vertical Light
            const distVert = Math.hypot(mouseX - (CENTER + 70), mouseY - (CENTER - 70));
            if (distVert < 30) {
                verticalLight = !verticalLight;
            }

            // Check if clicked near Horizontal Light
            const distHoriz = Math.hypot(mouseX - (CENTER - 70), mouseY - (CENTER + 70));
            if (distHoriz < 30) {
                horizontalLight = !horizontalLight;
            }
        });

        gameLoop();
    </script>
</body>
</html>
