---
stages:
  - lint
  - build
  - deploy

lint:
  stage: lint
  image: registry.akehir.com/infra/yamllint/yamllint
  script:
    - yamllint --list-files .
    - yamllint .

build:
  stage: build
  image: registry.akehir.com:443/infra/node-with-chrome/node-with-chrome:latest
  rules:
    - if: '$CI_COMMIT_REF_SLUG == "master"'
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - npm i
  script:
    - npm run lint
    - npm run test:docker
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1337 mins

deploy:
  stage: deploy
  tags:
    - metal
  needs: ['build', 'lint']
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_SLUG == "master"'
      changes:
        - src/**/*
        - package.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
      changes:
        - src/**/*
        - package.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/akehir-site
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG:latest -t $IMAGE_TAG:$CI_COMMIT_REF_SLUG -t $IMAGE_TAG:$CI_COMMIT_SHORT_SHA -t $IMAGE_TAG:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-$(date +%s) .
    - docker push $IMAGE_TAG -a
