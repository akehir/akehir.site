---
stages:
  - lint
  - build
  - deploy
  - scan

linty:
  stage: lint
  image: registry.akehir.com/infra/yamllint/yamllint
  script:
    - yamllint --list-files .
    - yamllint .

lintk:
  stage: lint
  image: registry.akehir.com/infra/kubernetes-validate/kubernetes-validate
  script:
    - kubernetes-validate ./manifests/*.yaml

lintngnx:
  stage: lint
  image: registry.akehir.com/infra/alpine-nginx/alpine-nginx
  script:
    - rm -f /etc/nginx/nginx.conf
    - cp $CI_PROJECT_DIR/nginx.conf /etc/nginx/nginx.conf
    - nginx -t -c /etc/nginx/nginx.conf

scan-gitleaks:
  stage: scan
  image: registry.akehir.com/infra/gitleaks/gitleaks
  variables:
    GIT_DEPTH: "0"
  artifacts:
    when: always
    paths:
      - report-gitleaks.json
  script:
    - gitleaks git -v --no-banner --redact --exit-code 1 --report-format json --report-path report-gitleaks.json .

build:
  stage: build
  image: registry.akehir.com:443/infra/node-with-chrome/node-with-chrome
  rules:
    - if: '$CI_COMMIT_REF_SLUG == "master"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
  before_script:
    - npm i
  script:
    - npm run lint
    - npm run test:docker
    - npm run build
    - gzip -9 -k -r dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1337 mins

deploy:
  stage: deploy
  tags:
    - metal
  needs: ['build', 'linty', 'lintk', 'lintngnx']
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_SLUG == "master"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/akehir-site
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG:latest -t $IMAGE_TAG:$CI_COMMIT_REF_SLUG -t $IMAGE_TAG:$CI_COMMIT_SHORT_SHA -t $IMAGE_TAG:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-$(date +%s) .
    - docker push $IMAGE_TAG -a --quiet

scan-trivy-repository:
  stage: scan
  image: registry.akehir.com/infra/trivy/trivy
  artifacts:
    paths:
      - report-repository.json
  script:
    - trivy fs --severity LOW,MEDIUM,HIGH,CRITICAL --scanners vuln,secret,misconfig --no-progress .
    - trivy fs --severity LOW,MEDIUM,HIGH,CRITICAL --scanners vuln,secret,misconfig --no-progress --format json --output report-repository.json .

scan-trivy-image:
  stage: scan
  image: registry.akehir.com/infra/docker/dind-root
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_SLUG == "master"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
  needs:
    - job: deploy
      optional: true
  artifacts:
    paths:
      - report-image.json
  before_script:
    - ls -la /run
    - netstat -tulpn
    - nohup /usr/local/bin/dockerd-entrypoint.sh >/tmp/dockerd.log 2>&1 &
    - until docker info; do sleep 1; done
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.2
    - trivy image --severity LOW,MEDIUM,HIGH,CRITICAL --scanners vuln,secret,misconfig --no-progress $CI_REGISTRY_IMAGE/akehir-site:$CI_COMMIT_SHORT_SHA
    - trivy image --severity LOW,MEDIUM,HIGH,CRITICAL --scanners vuln,secret,misconfig --no-progress --format json --output report-image.json $CI_REGISTRY_IMAGE/akehir-site:$CI_COMMIT_SHORT_SHA
  after_script:
    - cat /tmp/dockerd.log

upload-trivy-repository:
  image: registry.akehir.com/infra/alpine-curl/alpine-curl
  stage: scan
  needs:
    - job: scan-trivy-repository
      artifacts: true
  script:
    - |
      curl \
      -H "Authorization: ApiKey $TRIVYHUB_TOKEN" \
      -F "project=$CI_PROJECT_NAME/repository" \
      -F "file=@report-repository.json" \
      -F "environment=production" \
      -F "branch=$CI_COMMIT_REF_NAME" \
      -F "commit=$CI_COMMIT_SHA" \
      -F "pipeline_url=$CI_JOB_URL" \
      -F "triggered_by=$GITLAB_USER_LOGIN" \
      https://trivyhub.akehir.com/api/v1/report

upload-trivy-image:
  image: registry.akehir.com/infra/alpine-curl/alpine-curl
  stage: scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_SLUG == "master"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
  needs:
    - job: scan-trivy-image
      artifacts: true
  script:
    - |
      curl \
      -H "Authorization: ApiKey $TRIVYHUB_TOKEN" \
      -F "project=$CI_PROJECT_NAME/image" \
      -F "file=@report-image.json" \
      -F "environment=production" \
      -F "branch=$CI_COMMIT_REF_NAME" \
      -F "commit=$CI_COMMIT_SHA" \
      -F "pipeline_url=$CI_JOB_URL" \
      -F "triggered_by=$GITLAB_USER_LOGIN" \
      https://trivyhub.akehir.com/api/v1/report

scan-npm:
  stage: scan
  image: registry.akehir.com:443/infra/node-with-chrome/node-with-chrome
  allow_failure: true
  script:
    - npm audit
