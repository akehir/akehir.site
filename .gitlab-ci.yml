# Documentation
# https://docs.gitlab.com/ee/ci/yaml/

stages:
- test
- deploy

test:
  stage: test
  before_script:
   # - git submodule sync --recursive
   # - git submodule update --init --recursive
   - nvm i
   - npm i # using npm until https://github.com/yarnpkg/yarn/issues/760
  script:
   - npm run lint
   - npm run test -- --no-watch --progress=false --code-coverage --browsers ChromeHeadless
   - npm run build

  artifacts:
    paths:
    - dist/akehir/
    expire_in: 1337 mins

deploy_production:
  stage: deploy
  script:
    - rsync --delete -rlvvzhe ssh $CI_PROJECT_DIR/dist/akehir/ akehir@192.168.77.111:/app/web/akehir/master/ # syncronize from build server to local via rsync
  only:
  - master

deploy_develop:
  stage: deploy
  script:
    - rsync --delete -rlvvzhe ssh $CI_PROJECT_DIR/dist/akehir/ akehir@192.168.77.111:/app/web/akehir/develop/ # syncronize from build server to local via rsync
  only:
    - develop
