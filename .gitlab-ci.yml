---
stages:
  - lint
  - build
  - deploy
  - scan

linty:
  stage: lint
  image: registry.akehir.com/infra/yamllint/yamllint
  script:
    - yamllint --list-files .
    - yamllint .

lintk:
  stage: lint
  image: registry.akehir.com/infra/kubernetes-validate/kubernetes-validate
  script:
    - kubernetes-validate ./manifests/*.yaml

lintngnx:
  stage: lint
  image: registry.akehir.com/infra/alpine-nginx/alpine-nginx
  script:
    - rm -f /etc/nginx/nginx.conf
    - cp $CI_PROJECT_DIR/nginx.conf /etc/nginx/nginx.conf
    - nginx -t -c /etc/nginx/nginx.conf

build:
  stage: build
  image: registry.akehir.com:443/infra/node-with-chrome/node-with-chrome
  rules:
    - if: '$CI_COMMIT_REF_SLUG == "master"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - npm i
  script:
    - npm run lint
    - npm run test:docker
    - npm run build
    - gzip -9 -k -r dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1337 mins

deploy:
  stage: deploy
  tags:
    - metal
  needs: ['build', 'linty', 'lintk', 'lintngnx']
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_SLUG == "master"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_REF_SLUG == "develop"'
      changes:
        - src/**/*
        - package.json
        - angular.json
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
      when: on_success
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE/akehir-site
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG:latest -t $IMAGE_TAG:$CI_COMMIT_REF_SLUG -t $IMAGE_TAG:$CI_COMMIT_SHORT_SHA -t $IMAGE_TAG:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-$(date +%s) .
    - docker push $IMAGE_TAG -a --quiet

scan-trivy:
  stage: scan
  image: registry.akehir.com/infra/trivy/trivy
  script:
    - trivy fs --severity HIGH,CRITICAL --scanners vuln,secret,misconfig --no-progress .

scan-npm:
  stage: scan
  image: registry.akehir.com:443/infra/node-with-chrome/node-with-chrome
  allow_failure: true
  script:
    - npm audit
